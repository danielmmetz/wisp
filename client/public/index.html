<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="color-scheme" content="dark light" />
        <title>wisp</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="/style.css" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    </head>
    <body>
        <header class="site-header">
            <div class="site-header-left">
                <a id="brand" href="/" class="brand">
                    <svg class="brand-glyph" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
                        <path d="M4 11v2" />
                        <path d="M8 8v8" />
                        <path d="M12 5v14" />
                        <path d="M16 8v8" />
                        <path d="M20 11v2" />
                    </svg>
                    <span class="brand-text">wisp</span>
                </a>
                <p class="tagline">privacy conscious chat</p>
                <code id="room-code-narrow" class="code-narrow"></code>
                <span id="room-status-narrow" class="status-narrow"></span>
                <button
                    id="diag-trigger-narrow"
                    class="diag-trigger header-action"
                    type="button"
                    aria-label="Connection diagnostics"
                    title="Connection diagnostics"
                    aria-haspopup="dialog"
                    aria-expanded="false"
                    aria-controls="diag-dialog"
                >?</button>
            </div>
            <div class="site-header-actions">
                <button
                    id="self-mute-narrow"
                    class="mute-btn header-action"
                    type="button"
                    title="Mute"
                    aria-label="Mute"
                >
                    <svg class="icon-mic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="9" y="2" width="6" height="12" rx="3" />
                        <path d="M5 10v2a7 7 0 0 0 14 0v-2" />
                        <line x1="12" y1="19" x2="12" y2="22" />
                    </svg>
                    <svg class="icon-mic-slash" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <line x1="3" y1="3" x2="21" y2="21" />
                        <path d="M9 9v3a3 3 0 0 0 5 2.13" />
                        <path d="M15 9.34V5a3 3 0 0 0-5.94-.6" />
                        <path d="M19 10v2a7 7 0 0 1-.11 1.23" />
                        <path d="M5 10v2a7 7 0 0 0 12 5" />
                        <line x1="12" y1="19" x2="12" y2="22" />
                    </svg>
                </button>
                <button
                    id="screen-share"
                    class="icon-btn header-action screen-share-btn"
                    type="button"
                    title="Share screen"
                    aria-label="Share screen"
                    aria-haspopup="menu"
                    aria-expanded="false"
                    hidden
                >
                    <svg class="ic-screen" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="2" y="4" width="20" height="13" rx="2" />
                        <line x1="8" y1="21" x2="16" y2="21" />
                        <line x1="12" y1="17" x2="12" y2="21" />
                    </svg>
                    <svg class="ic-screen-stop" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="2" y="4" width="20" height="13" rx="2" />
                        <line x1="8" y1="21" x2="16" y2="21" />
                        <line x1="12" y1="17" x2="12" y2="21" />
                        <line x1="3" y1="3" x2="21" y2="21" />
                    </svg>
                </button>
                <button
                    id="share-narrow"
                    class="icon-btn header-action share-or-copy"
                    type="button"
                    title="Copy join link"
                    aria-label="Copy join link"
                >
                    <svg class="ic-copy" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2" />
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
                    </svg>
                    <svg class="ic-share" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8" />
                        <polyline points="16 6 12 2 8 6" />
                        <line x1="12" y1="2" x2="12" y2="15" />
                    </svg>
                </button>
                <button
                    id="self-leave-narrow"
                    class="leave-btn icon-btn header-action"
                    type="button"
                    title="Leave room"
                    aria-label="Leave room"
                >
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                        <polyline points="16 17 21 12 16 7" />
                        <line x1="21" y1="12" x2="9" y2="12" />
                    </svg>
                </button>
                <button
                    id="audio-gear"
                    class="icon-btn gear-btn"
                    type="button"
                    title="Audio settings"
                    aria-label="Audio settings"
                    aria-expanded="false"
                    aria-controls="audio-popover"
                >
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="12" cy="12" r="3" />
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
                    </svg>
                </button>
            </div>
            <div id="share-picker" class="popover" role="menu" aria-label="Share screen" hidden>
                <div class="pop-head">Share screen</div>
                <button id="share-document" type="button" role="menuitem" class="pop-action">
                    <span class="pop-action-title">Document</span>
                    <span class="pop-action-sub">Crisp text, low frame rate. Best for PDFs and code.</span>
                </button>
                <button id="share-motion" type="button" role="menuitem" class="pop-action">
                    <span class="pop-action-title">Motion</span>
                    <span class="pop-action-sub">30 fps. Best for videos and games.</span>
                </button>
            </div>
            <div id="audio-popover" class="popover" role="dialog" aria-label="Audio settings" hidden>
                <div class="pop-head">Audio</div>
                <label class="pop-row">
                    <span class="lbl">Microphone</span>
                    <select id="mic-select">
                        <option value="">(system default)</option>
                    </select>
                </label>
                <label class="pop-row">
                    <span class="lbl">Speaker</span>
                    <select id="speaker-select">
                        <option value="">(system default)</option>
                    </select>
                </label>
                <div class="test-row">
                    <button id="mic-test" type="button" class="ghost">test mic</button>
                    <div class="meter" aria-hidden="true">
                        <div id="mic-meter-bar" class="bar"></div>
                    </div>
                </div>
            </div>
        </header>
        <main id="root">
            <section id="lobby" class="card">
                <form id="create-form" class="row">
                    <input
                        id="name-input"
                        name="name"
                        placeholder="your name"
                        autocomplete="off"
                        spellcheck="false"
                        maxlength="32"
                    />
                    <button id="create-btn" type="submit" class="primary">
                        Create Room
                    </button>
                </form>
                <div class="divider"><span>or</span></div>
                <form id="join-form" class="row">
                    <input
                        id="join-code"
                        name="code"
                        placeholder="room-code"
                        autocomplete="off"
                        spellcheck="false"
                        required
                    />
                    <button type="submit">Join</button>
                </form>
                <p id="lobby-error" class="error" hidden></p>
            </section>

            <section id="room" hidden>
                <aside class="rail">
                    <header class="rail-head">
                        <div class="rail-head-id">
                            <code id="room-code" class="code"></code>
                            <div class="rail-head-meta">
                                <span id="room-status" class="meta"></span>
                                <button
                                    id="diag-trigger"
                                    class="diag-trigger"
                                    type="button"
                                    aria-label="Connection diagnostics"
                                    title="Connection diagnostics"
                                    aria-haspopup="dialog"
                                    aria-expanded="false"
                                    aria-controls="diag-dialog"
                                >?</button>
                            </div>
                        </div>
                        <button
                            id="copy-link"
                            class="icon-btn share-or-copy"
                            type="button"
                            title="Copy join link"
                            aria-label="Copy join link"
                        >
                            <svg class="ic-copy" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2" />
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
                            </svg>
                            <svg class="ic-share" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8" />
                                <polyline points="16 6 12 2 8 6" />
                                <line x1="12" y1="2" x2="12" y2="15" />
                            </svg>
                        </button>
                    </header>
                    <button
                        id="presenter-indicator"
                        class="presenter-indicator"
                        type="button"
                        aria-label="View screen share"
                        hidden
                    >
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <rect x="2" y="4" width="20" height="13" rx="2" />
                            <line x1="8" y1="21" x2="16" y2="21" />
                            <line x1="12" y1="17" x2="12" y2="21" />
                        </svg>
                        <span class="presenter-indicator-text">
                            <span class="presenter-indicator-title">Screen share</span>
                            <span id="presenter-indicator-name" class="presenter-indicator-name"></span>
                        </span>
                    </button>
                    <nav class="room-tabs" role="tablist" aria-label="Room view">
                        <button
                            id="tab-users"
                            type="button"
                            role="tab"
                            data-tab="users"
                            aria-controls="peers"
                            aria-selected="false"
                        >Users<span id="tab-users-count" class="tab-count"></span></button>
                        <button
                            id="tab-chat"
                            type="button"
                            role="tab"
                            data-tab="chat"
                            aria-controls="chat-messages"
                            aria-selected="true"
                        >Chat</button>
                    </nav>
                    <ul id="peers" class="rail-list" role="tabpanel" aria-labelledby="tab-users">
                        <li id="self-peer-row" class="peer self">
                            <span class="dot" aria-hidden="true"></span>
                            <span id="self-peer-name" class="nm editable" title="Click to rename"></span>
                        </li>
                    </ul>
                    <div class="rail-self">
                        <span class="dot" aria-hidden="true"></span>
                        <div class="id">
                            <strong id="self-name" class="editable" title="Click to rename"></strong>
                            <span id="self-quality" class="qmeta"></span>
                        </div>
                        <div class="ctrls">
                            <button
                                id="self-mute"
                                class="mute-btn"
                                type="button"
                                title="Mute"
                                aria-label="Mute"
                            >
                                <svg class="icon-mic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <rect x="9" y="2" width="6" height="12" rx="3" />
                                    <path d="M5 10v2a7 7 0 0 0 14 0v-2" />
                                    <line x1="12" y1="19" x2="12" y2="22" />
                                </svg>
                                <svg class="icon-mic-slash" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <line x1="3" y1="3" x2="21" y2="21" />
                                    <path d="M9 9v3a3 3 0 0 0 5 2.13" />
                                    <path d="M15 9.34V5a3 3 0 0 0-5.94-.6" />
                                    <path d="M19 10v2a7 7 0 0 1-.11 1.23" />
                                    <path d="M5 10v2a7 7 0 0 0 12 5" />
                                    <line x1="12" y1="19" x2="12" y2="22" />
                                </svg>
                            </button>
                            <button
                                id="leave-btn"
                                class="leave-btn icon-btn"
                                type="button"
                                title="Leave room"
                                aria-label="Leave room"
                            >
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                                    <polyline points="16 17 21 12 16 7" />
                                    <line x1="21" y1="12" x2="9" y2="12" />
                                </svg>
                            </button>
                        </div>
                    </div>
                </aside>
                <div class="vrule" aria-hidden="true"></div>
                <main class="chat" role="tabpanel" aria-labelledby="tab-chat">
                    <ul id="chat-messages" class="chat-scroll"></ul>
                    <div id="chat-edit-banner" class="chat-edit-banner" hidden>
                        <span class="chat-edit-banner-label">Editing message</span>
                        <button id="chat-edit-cancel" type="button" class="ghost chat-edit-banner-cancel">Cancel</button>
                    </div>
                    <form id="chat-form" class="chat-compose" autocomplete="off">
                        <textarea
                            id="chat-input"
                            maxlength="2000"
                            autocomplete="off"
                            spellcheck="false"
                            aria-label="Message"
                            rows="1"
                        ></textarea>
                        <button type="submit" class="primary">Send</button>
                    </form>
                </main>
                <section id="presenter-pane" class="presenter" hidden aria-label="Screen share viewer">
                    <video
                        id="presenter-video"
                        class="presenter-video"
                        autoplay
                        playsinline
                        muted
                    ></video>
                    <button
                        id="presenter-stop"
                        type="button"
                        class="presenter-stop-btn"
                        hidden
                    >Stop sharing</button>
                    <div class="presenter-overlay-controls" role="toolbar" aria-label="Screen share viewer controls">
                        <div id="presenter-audio" class="presenter-overlay-volume" role="group" aria-label="Screen audio volume" hidden>
                            <button
                                id="presenter-audio-mute"
                                type="button"
                                class="presenter-overlay-btn"
                                title="Mute screen audio"
                                aria-label="Mute screen audio"
                            >
                                <svg class="ic-vol-on" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
                                    <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
                                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14" />
                                </svg>
                                <svg class="ic-vol-off" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
                                    <line x1="23" y1="9" x2="17" y2="15" />
                                    <line x1="17" y1="9" x2="23" y2="15" />
                                </svg>
                            </button>
                            <input
                                id="presenter-audio-vol"
                                type="range"
                                min="0"
                                max="200"
                                value="100"
                                class="presenter-volume-slider"
                                aria-label="Screen audio volume"
                            />
                        </div>
                        <button
                            id="presenter-fullscreen"
                            type="button"
                            class="presenter-overlay-btn"
                            title="Fullscreen"
                            aria-label="Fullscreen"
                        >
                            <svg class="ic-enter" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <polyline points="4 9 4 4 9 4" />
                                <polyline points="20 9 20 4 15 4" />
                                <polyline points="4 15 4 20 9 20" />
                                <polyline points="20 15 20 20 15 20" />
                            </svg>
                            <svg class="ic-exit" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <polyline points="9 4 9 9 4 9" />
                                <polyline points="15 4 15 9 20 9" />
                                <polyline points="9 20 9 15 4 15" />
                                <polyline points="15 20 15 15 20 15" />
                            </svg>
                        </button>
                        <button
                            id="presenter-close"
                            type="button"
                            class="presenter-overlay-btn"
                            title="Close"
                            aria-label="Close screen share viewer"
                        >
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <line x1="18" y1="6" x2="6" y2="18" />
                                <line x1="6" y1="6" x2="18" y2="18" />
                            </svg>
                        </button>
                    </div>
                </section>
            </section>
        </main>

        <div id="diag-dialog"
            class="diag-dialog"
            role="dialog"
            aria-modal="true"
            aria-labelledby="diag-title"
            hidden
        >
            <div class="diag-card">
                <header class="diag-head">
                    <div class="diag-title-block">
                        <div id="diag-title" class="diag-title">Connection diagnostics</div>
                        <div id="diag-sub" class="diag-sub"></div>
                    </div>
                    <button
                        id="diag-close"
                        class="icon-btn diag-close"
                        type="button"
                        aria-label="Close diagnostics"
                        title="Close"
                    >
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <line x1="18" y1="6" x2="6" y2="18" />
                            <line x1="6" y1="6" x2="18" y2="18" />
                        </svg>
                    </button>
                </header>
                <div id="diag-body" class="diag-body"></div>
                <footer class="diag-foot">
                    <button id="diag-copy" class="diag-btn" type="button">
                        <svg class="copy-tick" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <polyline points="20 6 9 17 4 12" />
                        </svg>
                        <span class="copy-label">Copy diagnostics</span>
                    </button>
                    <span class="diag-foot-spacer"></span>
                    <button id="diag-reconnect" class="diag-btn diag-btn-primary" type="button" hidden>Reconnect</button>
                </footer>
            </div>
        </div>

        <template id="peer-row">
            <li class="peer">
                <span class="dot" aria-hidden="true"></span>
                <span class="nm"></span>
                <span class="badge transport"></span>
                <span class="cipher" aria-hidden="true"></span>
                <div class="peer-extra">
                    <input type="range" min="0" max="200" value="100" class="vol" />
                    <button class="mute icon-btn" type="button" title="Mute" aria-label="Mute">
                        <svg class="icon-mic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <rect x="9" y="2" width="6" height="12" rx="3" />
                            <path d="M5 10v2a7 7 0 0 0 14 0v-2" />
                            <line x1="12" y1="19" x2="12" y2="22" />
                        </svg>
                        <svg class="icon-mic-slash" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <line x1="3" y1="3" x2="21" y2="21" />
                            <path d="M9 9v3a3 3 0 0 0 5 2.13" />
                            <path d="M15 9.34V5a3 3 0 0 0-5.94-.6" />
                            <path d="M19 10v2a7 7 0 0 1-.11 1.23" />
                            <path d="M5 10v2a7 7 0 0 0 12 5" />
                            <line x1="12" y1="19" x2="12" y2="22" />
                        </svg>
                    </button>
                </div>
            </li>
        </template>

        <template id="chat-message">
            <li class="msg">
                <span class="head-line">
                    <span class="who"></span>
                    <span class="body"></span>
                </span>
                <span class="time"></span>
                <button
                    class="msg-menu-btn"
                    type="button"
                    aria-label="Message actions"
                    aria-haspopup="menu"
                    aria-expanded="false"
                    hidden
                >
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <circle cx="5" cy="12" r="2" />
                        <circle cx="12" cy="12" r="2" />
                        <circle cx="19" cy="12" r="2" />
                    </svg>
                </button>
            </li>
        </template>

        <template id="chat-msg-menu">
            <div class="msg-menu" role="menu">
                <button class="msg-menu-item" role="menuitem" type="button" data-action="edit">Edit message</button>
